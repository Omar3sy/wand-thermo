# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Thermostat"
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_AUXDISPLAY=y
CONFIG_AUXDISPLAY_HD44780=y

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/thermostat.zap"

# 32782 == 0x800e (example thermostat product)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32782
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterThermo"

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Crash diagnostics (kept as a safety net; found the abort() root cause with
# these + a GDB breakpoint, LOG_MODE_IMMEDIATE/EXCEPTION_STACK_TRACE removed
# again since they didn't contribute and add overhead)
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_THREAD_STACK_INFO=y

# arm-zephyr-eabi-readelf.exe is blocked by WDAC on the build machine; this
# skips the post-build zephyr.stat generation that calls it (diagnostic-only
# output, nothing in the build depends on it).
CONFIG_OUTPUT_STAT=n

# Default system workqueue stack (1120 B) is too small for BatteryManager's
# work handler: ADC read + 8 back-to-back Matter attribute writes overflowed
# it (Zephyr fatal error 2, thread "sysworkq").
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Disable NFC onboarding
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Factory Data completely disabled (choice option "No factory data provider")
# - avoids Factory Data generation tooling, blocked by WDAC on build machine
CONFIG_CHIP_FACTORY_DATA_NONE=y

# Fixed commissioning values for testing
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
CONFIG_CHIP_DEVICE_VENDOR_ID=65521