CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
# LIT (Long Idle Time) zieht automatisch CHECK_IN_SUPPORT + UAT_SUPPORT mit
# rein (zusaetzlicher periodischer Check-In-Funkverkehr an registrierte
# Clients) - haben wir ohne echten Bedarf (kein Hub braucht 120s-Idle-Zeiten)
# aktiviert gehabt. TRV-Referenzprojekt nutzt stattdessen einfaches SIT
# (Short Idle Time) und kommt auf 23-25uA. Ausserdem war unser
# ACTIVE_MODE_DURATION=300ms laut Kconfig-Hilfetext fuer LIT-Geraete ohnehin
# ungueltig (Minimum 5000ms fuer LIT). Zurueck auf SIT.
# CONFIG_CHIP_ICD_LIT_SUPPORT=y
# Ohne LIT_SUPPORT gilt der SIT-Spec-Grenzwert: SLOW_POLL_INTERVAL darf
# 15000ms (CHIP_ICD_SIT_SLOW_POLL_LIMIT) nicht ueberschreiten, sonst schlaegt
# ein static_assert in ICDConfigurationData.h fehl. 120000 (vorheriger Wert,
# nur fuer LIT gueltig) geht nicht mehr - also auf das SIT-Maximum.
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=15000
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=200
CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=300
# Dieses Symbol ist in SEKUNDEN (nicht ms) - 120000 wurde faelschlich als ms
# interpretiert und ueberschritt die Matter-Spec-Obergrenze von 64800s (18h).
# Referenzprojekt meinte "120 s" (Sekunden).
CONFIG_CHIP_ICD_IDLE_MODE_DURATION=120


CONFIG_NCS_SAMPLE_MATTER_LEDS=n
CONFIG_CHIP_LIB_SHELL=n

CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=0

CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_CHIP_BLE_EXT_ADVERTISING=y

CONFIG_SYSTEM_CLOCK_NO_WAIT=y
# Von 4000ms erhoeht - jede Kalibrierung kostet einen kurzen Stromspike,
# seltener kalibrieren spart im Schnitt etwas Strom auf Kosten der
# HF-Timing-Genauigkeit (bei 8s weiterhin unkritisch).
CONFIG_MPSL_CALIBRATION_PERIOD=8000

CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_BOOT_BANNER=n

# UART/Konsole komplett aus - spart den Stromverbrauch des UART-Taktdomains,
# kostet dafuer jegliche Boot-/Debug-Ausgabe in diesem Build.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# Alle Log-Arten komplett aus (RTT war in prj.conf ohnehin schon deaktiviert,
# das hier schaltet auch den Log-Subsystem-Overhead selbst ab, nicht nur den
# Ausgabeweg).
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n

CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_PM_DEVICE=y
# Ohne das schlief ungenutzte Peripherie (I2C/SPI/ADC/Display) nie, auch
# wenn CONFIG_PM_DEVICE=y gesetzt war - Runtime-PM ruft das Device-Suspend
# tatsaechlich auf, sobald ein Treiber ungenutzt ist (nicht nur CPU-Idle).
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_PRINTK=n
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_DEBUG=n

# CONFIG_PM=y wird vom Kconfig-System fuer nrf54l15dk/cpuapp aktuell (NCS v3.4.0)
# ignoriert ("assigned the value 'y' but got the value 'n'": HAS_PM ist fuer die
# nRF54L-SoC-Serie in diesem Zephyr-Tree noch nicht selektiert, nur nRF54H/nRF92).
# Bleibt trotzdem gesetzt fuer den Tag, an dem NCS das nachruestet - hat aktuell
# keine Wirkung, der eigentliche Gewinn kommt aus PM_DEVICE_RUNTIME oben.
CONFIG_PM=y
