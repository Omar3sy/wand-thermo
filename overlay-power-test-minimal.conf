# Test A (PPK2-Isolationsmessung): Nur ICD/Thread Boot+Attach+Idle, keine
# TRV-Subscription, kein SCD41-Sensor-Polling, kein E-Paper-Refresh. Zusammen
# mit overlay-low_power.conf verwenden:
#
#   -DEXTRA_CONF_FILE="overlay-low_power.conf;overlay-power-test-minimal.conf"
#
# NICHT fuer normale Builds - das Geraet zeigt dann nichts an und steuert
# das Ventil nicht. Nur zum Isolieren des reinen ICD/Thread-Stromanteils.
CONFIG_WT_POWER_TEST_MINIMAL=y
