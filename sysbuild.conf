SB_CONFIG_MATTER=y
SB_CONFIG_PARTITION_MANAGER=n

# Kconfig.sysbuild defaults this to y unconditionally, which needs DAC/PAI
# certs we don't have (CONFIG_CHIP_FACTORY_DATA_NONE=y in prj.conf - no
# factory data provider at all). A previous incremental build happened to
# have a stale cached factory_data.hex lying around so this never surfaced;
# a full pristine (-p always) build removes it and the matter_factory_data
# sysbuild image then fails trying to regenerate certs we never configured.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n

# Pure Ed25519 image signing: skips the separate SHA pre-hash step in the
# bootloader verify path (smaller mcuboot). Applied at sysbuild level so the
# app image is signed with the matching scheme.
SB_CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
