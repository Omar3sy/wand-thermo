# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Wandthermostat"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/thermostat.zap"

# 32782 == 0x800e (example thermostat product)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32782
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterThermo"

# Enable system reset on fatal error
CONFIG_RESET_ON_FATAL_ERROR=y

# Disable all debug features
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_ASSERT=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_ASSERT_NO_FILE_INFO=y
CONFIG_PRINTK=n
CONFIG_PRINTK_SYNC=n
CONFIG_THREAD_NAME=n
CONFIG_DEBUG=n
CONFIG_BOOT_BANNER=n

# Disable NFC onboarding
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Enable Factory Data feature
# TODO: SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n in sysbuild.conf blockiert
# echte Factory-Data fuer Release-Builds (wurde fuer den normalen prj.conf-
# Debug-Build noetig, siehe Kommentar dort: DAC/PAI-Zertifikate fehlen).
# Vor Produktionsstart build-spezifisch loesen, sonst generiert dieser
# Release-Build hier trotz CONFIG_CHIP_FACTORY_DATA_BUILD=y keine echten
# Credentials.
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Enable Watchdog
CONFIG_NCS_SAMPLE_MATTER_WATCHDOG=y

# Low-Power-Konfiguration (Session vom 2026-10-22/23, auf ~9uA im 19h-Test
# gemessen - siehe overlay-low_power.conf fuer die urspruengliche, separate
# Variante). Jetzt fester Bestandteil des Release-Builds, nicht mehr nur
# optionales Overlay.

# Matter ICD (Thread Sleepy End Device) - SIT (Short Idle Time), bewusst
# NICHT LIT: LIT zieht automatisch CHECK_IN_SUPPORT + UAT_SUPPORT mit rein
# (periodischer Check-In-Funkverkehr), den wir ohne Hub-Bedarf nicht
# brauchen - kostete in einem fruehen Test unnoetig Strom.
CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
# SIT-Spec-Maximum (CHIP_ICD_SIT_SLOW_POLL_LIMIT) ist 15000ms - darueber
# schlaegt ein static_assert in ICDConfigurationData.h fehl.
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=15000
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=200
CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=300
# In Sekunden, nicht ms.
CONFIG_CHIP_ICD_IDLE_MODE_DURATION=120

CONFIG_NCS_SAMPLE_MATTER_LEDS=n
CONFIG_CHIP_LIB_SHELL=n

CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=0

CONFIG_SYSTEM_CLOCK_NO_WAIT=y
CONFIG_MPSL_CALIBRATION_PERIOD=4000

CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_PM_DEVICE=y
# Ohne das schlief ungenutzte Peripherie (I2C/SPI/ADC/Display) nie, auch
# wenn CONFIG_PM_DEVICE=y gesetzt war - Runtime-PM ruft das Device-Suspend
# tatsaechlich auf, sobald ein Treiber ungenutzt ist (nicht nur CPU-Idle).
CONFIG_PM_DEVICE_RUNTIME=y

# CONFIG_PM=y wird vom Kconfig-System fuer nrf54l15dk/cpuapp aktuell (NCS
# v3.4.0) ignoriert (HAS_PM ist fuer die nRF54L-SoC-Serie in diesem Zephyr-
# Tree noch nicht selektiert). Bleibt trotzdem gesetzt fuer den Tag, an dem
# NCS das nachruestet - hat aktuell keine Wirkung.
CONFIG_PM=y

# Enable LTO to decrease the flash usage.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Treiber-Configs, die seitdem in prj.conf dazugekommen sind (SCD41-Sensor,
# E-Paper-Display) - ohne diese wuerde ein Release-Build aktuell gar nicht
# mehr durchlaufen (I2C/ADC/DISPLAY/SPI fehlten komplett in dieser Datei).
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
