# Test C (PPK2-Isolationsmessung): ICD/Thread + SCD41-Sensor aktiv,
# Display und TRV-Subscription deaktiviert. Zusammen mit overlay-low_power.conf:
#
#   -DEXTRA_CONF_FILE="overlay-low_power.conf;overlay-test-only-sensor.conf"
#
# NICHT fuer normale Builds - das Geraet zeigt nichts an und das Ventil wird
# nicht angesteuert.
CONFIG_WT_DISABLE_DISPLAY=y
CONFIG_WT_DISABLE_TRV_SUBSCRIPTION=y
