# Test B (PPK2-Isolationsmessung): ICD/Thread + E-Paper-Display aktiv,
# Sensor und TRV-Subscription deaktiviert. Zusammen mit overlay-low_power.conf:
#
#   -DEXTRA_CONF_FILE="overlay-low_power.conf;overlay-test-only-display.conf"
#
# NICHT fuer normale Builds - es werden keine Sensordaten gemessen und das
# Ventil nicht angesteuert.
CONFIG_WT_DISABLE_SENSOR=y
CONFIG_WT_DISABLE_TRV_SUBSCRIPTION=y
